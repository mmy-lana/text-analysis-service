[project]
name = "api"
version = "0.0.0"
description = "Text Sentiment & Readability API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "libsql-client",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "ISC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` in argument defaults is the canonical FastAPI pattern.
"app/api/**/*.py" = ["B008"]
"app/dependencies.py" = ["B008"]
# Healthcheck and boot-lifecycle deliberately swallow transport failures.
"app/database.py" = ["BLE001"]
"app/main.py" = ["BLE001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
